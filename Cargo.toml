[package]
name = "disk-cleaner-mcp"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
authors = ["Zero <nguyenchithang2804@gmail.com>"]
license = "MIT"
description = "Rust MCP server: fast safe disk cleanup for AI agents (Windows/macOS/Linux)"
repository = "https://github.com/CThawngs/Disk-Cleaner-MCP"
keywords = ["mcp", "disk", "cleanup", "rust", "ai-agent"]
categories = ["filesystem", "development-tools"]

[dependencies]
anyhow = "1.0"
dirs = "6.0"
getrandom = "0.4"
glob = "0.3"
jwalk = "0.9"
rayon = "1.12"
rmcp = { version = "3.1", features = ["server", "macros", "schemars", "transport-io"] }
schemars = { version = "1", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sysinfo = "0.39"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trash = "5.2"

# Optional HTTP mode: `cargo build --features http`, run `--http [PORT]`.
# Loopback-only Streamable HTTP; stdio stays the default transport.
[features]
default = []
http = ["dep:axum", "rmcp/transport-streamable-http-server"]

[dependencies.axum]
version = "0.8"
optional = true

[package.metadata.rpm]
assets = [
    { source = "target/release/disk-cleaner-mcp", dest = "/usr/bin/disk-cleaner-mcp", mode = "0755" },
    { source = "completions/disk-cleaner-mcp.bash", dest = "/usr/share/bash-completion/completions/disk-cleaner-mcp", mode = "0644" },
    { source = "completions/disk-cleaner-mcp.zsh", dest = "/usr/share/zsh/site-functions/_disk-cleaner-mcp", mode = "0644" },
    { source = "disk-cleaner-mcp.1", dest = "/usr/share/man/man1/disk-cleaner-mcp.1", mode = "0644" }
]

[package.metadata.rpm.signing]
generate_key = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[package.metadata.deb]
name = "disk-cleaner-mcp"
maintainer = "Zero <nguyenchithang2804@gmail.com>"
copyright = "2026 Zero"
license-file = "LICENSE"
description = "Rust MCP server: fast safe disk cleanup for AI agents"
section = "utils"
assets = [
    ["target/release/disk-cleaner-mcp", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/disk-cleaner-mcp/", "644"],
    ["disk-cleaner-mcp.1", "usr/share/man/man1/", "644"],
    ["completions/disk-cleaner-mcp.bash", "usr/share/bash-completion/completions/", "644"],
    ["completions/disk-cleaner-mcp.zsh", "usr/share/zsh/site-functions/", "644"],
]

[dev-dependencies]
proptest = "1.5"
