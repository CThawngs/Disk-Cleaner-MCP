# cargo-deny policy — license + advisory gate (Group 1: supply chain).
# No source replacement: `no-unsafe` is info-only, advisories fail CI.
[graph]
targets = [
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
  { triple = "aarch64-apple-darwin" }
]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "workspace"
ignore = []

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Unicode-3.0", "Zlib", "MPL-2.0"]
exceptions = []
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
deny = []
skip = []

[sources]
unknown-registry = "warn"
unknown-git = "deny"
