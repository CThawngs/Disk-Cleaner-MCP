name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: Install trash deps (Linux)
        if: runner.os == 'Linux'
        # trash crate uses Gio trash (XDG spec) — needs libglib/gio
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin gvfs-bin || sudo apt-get install -y libglib2.0-bin
      - name: Install trash deps (macOS)
        if: runner.os == 'macOS'
        # trash crate on macOS uses Finder/AppleScript — no extra dep
        run: echo "no extra deps needed on macOS"
      - name: Format check
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --locked --release
      - name: Smoke test (E2E MCP stdio)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=target/release/disk-cleaner-mcp.exe; else BIN=target/release/disk-cleaner-mcp; fi
          (python3 smoke_test.py "$BIN" || python smoke_test.py "$BIN")

  release-build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: disk-cleaner-mcp-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/disk-cleaner-mcp${{ matrix.ext }}