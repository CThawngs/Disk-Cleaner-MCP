name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke on release artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=target/${{ matrix.target }}/release/disk-cleaner-mcp.exe; else BIN=target/${{ matrix.target }}/release/disk-cleaner-mcp; fi
          (python3 smoke_test.py "$BIN" || python smoke_test.py "$BIN")
      - name: SBOM (cargo-cyclonedx)
        run: |
          cargo install cargo-cyclonedx --locked --quiet
          cargo cyclonedx --format json --override-filename sbom-${{ matrix.target }}
      - name: RPM (Linux x86_64 native only; cargo-rpm cannot cross-compile)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          cargo install cargo-rpm --locked --quiet
          cargo rpm
      - name: Ad-hoc sign macOS binary (Gatekeeper-friendly, no cert needed)
        if: runner.os == 'macOS'
        run: codesign --force --sign - target/${{ matrix.target }}/release/disk-cleaner-mcp && codesign --verify target/${{ matrix.target }}/release/disk-cleaner-mcp
      - name: Rename binary with target suffix
        shell: bash
        run: |
          mv target/${{ matrix.target }}/release/disk-cleaner-mcp${{ matrix.ext }} \
             target/${{ matrix.target }}/release/disk-cleaner-mcp-${{ matrix.target }}${{ matrix.ext }}
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: disk-cleaner-mcp-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/disk-cleaner-mcp-${{ matrix.target }}${{ matrix.ext }}
            target/cyclonedx/sbom-${{ matrix.target }}.json
            target/release/*.rpm

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Include installers (README curl | bash / irm quick start)
        run: cp install.sh install.ps1 artifacts/
      - name: Flatten artifacts (upload preserves target/ tree)
        shell: bash
        run: |
          find artifacts -type f -name "disk-cleaner-mcp-*" -exec cp -f {} artifacts/ \;
          find artifacts -type f -name "sbom-*.json" -exec cp -f {} artifacts/ \;
          find artifacts -type f -name "*.rpm" -exec cp -f {} artifacts/ \;
          find artifacts -type f | sort
      - name: Show artifacts
        run: ls -la artifacts/
      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          { sha256sum disk-cleaner-mcp-* install.sh install.ps1 2>/dev/null; sha256sum sbom-*.json *.rpm 2>/dev/null; } > checksums.txt
          cat checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false