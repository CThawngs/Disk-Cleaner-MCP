name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ${{ matrix.target }}
      - name: Install trash deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-bin gvfs-bin || sudo apt-get install -y libglib2.0-bin
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke on release artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=target/${{ matrix.target }}/release/disk-cleaner-mcp.exe; else BIN=target/${{ matrix.target }}/release/disk-cleaner-mcp; fi
          (python3 smoke_test.py "$BIN" || python smoke_test.py "$BIN")
      - name: SBOM (cargo-cyclonedx)
        shell: bash
        run: |
          cargo install cargo-cyclonedx --locked --quiet
          cargo cyclonedx --format json --override-filename "sbom-${{ matrix.target }}"
          mkdir -p target/cyclonedx
          if [ -f "sbom-${{ matrix.target }}.json" ]; then
            mv -f "sbom-${{ matrix.target }}.json" "target/cyclonedx/sbom-${{ matrix.target }}.json"
          elif [ -f "sbom-${{ matrix.target }}.cdx.json" ]; then
            mv -f "sbom-${{ matrix.target }}.cdx.json" "target/cyclonedx/sbom-${{ matrix.target }}.json"
          else
            echo "ERROR: CycloneDX SBOM not found in workspace root" >&2
            ls -la
            exit 1
          fi
          test -s "target/cyclonedx/sbom-${{ matrix.target }}.json"
          ls -lh "target/cyclonedx/sbom-${{ matrix.target }}.json"
      - name: RPM (Linux x86_64 native only)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          mkdir -p target/release target/release/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp -f target/x86_64-unknown-linux-gnu/release/disk-cleaner-mcp target/release/disk-cleaner-mcp
          python3 - <<'PY'
          import pathlib, tomllib

          root = pathlib.Path.cwd()
          data = tomllib.loads((root / "Cargo.toml").read_text(encoding="utf-8"))
          pkg = data["package"]
          assets = pkg["metadata"]["rpm"]["assets"]

          install_lines = []
          files_lines = []
          for asset in assets:
              src = (root / asset["source"]).resolve()
              if not src.is_file():
                  raise SystemExit(f"Missing RPM asset source: {src}")
              dest = asset["dest"]
              mode = asset.get("mode", "0644")
              install_lines.append(f'install -Dm{mode} "{src}" "%{{buildroot}}{dest}"')
              file_entry = f"{dest}*" if "/man/" in dest else dest
              files_lines.append(f"%attr({mode}, root, root) {file_entry}")

          spec = "\n".join([
              "%global debug_package %{nil}",
              "%define _build_id_links none",
              f"Name:           {pkg['name']}",
              f"Version:        {pkg['version']}",
              "Release:        1",
              f"Summary:        {pkg['description']}",
              f"License:        {pkg['license']}",
              f"URL:            {pkg['repository']}",
              "BuildArch:      x86_64",
              "AutoReqProv:    no",
              "",
              "%description",
              pkg["description"],
              "",
              "%install",
              *install_lines,
              "",
              "%files",
              *files_lines,
              "",
          ])
          spec_path = root / "target/release/rpmbuild/SPECS" / f"{pkg['name']}.spec"
          spec_path.write_text(spec, encoding="utf-8")
          print(f"Generated RPM spec: {spec_path}")
          PY
          rpmbuild --nodeps --define "_topdir $(pwd)/target/release/rpmbuild" -bb target/release/rpmbuild/SPECS/disk-cleaner-mcp.spec
          shopt -s nullglob
          rpms=(target/release/rpmbuild/RPMS/x86_64/*.rpm)
          test ${#rpms[@]} -ge 1
          ls -lh "${rpms[@]}"
          rpm -qpl "${rpms[0]}"
      - name: Ad-hoc sign macOS binary (Gatekeeper-friendly, no cert needed)
        if: runner.os == 'macOS'
        run: codesign --force --sign - target/${{ matrix.target }}/release/disk-cleaner-mcp && codesign --verify target/${{ matrix.target }}/release/disk-cleaner-mcp
      - name: Rename binary with target suffix
        shell: bash
        run: |
          mv target/${{ matrix.target }}/release/disk-cleaner-mcp${{ matrix.ext }} \
             target/${{ matrix.target }}/release/disk-cleaner-mcp-${{ matrix.target }}${{ matrix.ext }}
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: disk-cleaner-mcp-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/disk-cleaner-mcp-${{ matrix.target }}${{ matrix.ext }}
            target/cyclonedx/sbom-${{ matrix.target }}.json
            target/release/rpmbuild/RPMS/x86_64/*.rpm

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true
      - name: Include installers (README curl | bash / irm quick start)
        run: cp install.sh install.ps1 artifacts/
      - name: Flatten artifacts (upload preserves target/ tree)
        shell: bash
        run: |
          find artifacts -mindepth 2 -type f -name "disk-cleaner-mcp-*" -exec mv -f {} artifacts/ \;
          find artifacts -mindepth 2 -type f -name "sbom-*.json" -exec mv -f {} artifacts/ \;
          find artifacts -mindepth 2 -type f -name "*.rpm" -exec mv -f {} artifacts/ \;
          find artifacts -mindepth 1 -type d -empty -delete
          find artifacts -maxdepth 1 -type f | sort
      - name: Show artifacts
        run: ls -la artifacts/
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd artifacts
          shopt -s nullglob
          files=(disk-cleaner-mcp-* install.sh install.ps1 sbom-*.json *.rpm)
          test ${#files[@]} -ge 1
          sha256sum "${files[@]}" > checksums.txt
          cat checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false
