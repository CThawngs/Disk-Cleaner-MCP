name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            ext: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          key: ${{ matrix.target }}
      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Smoke on release artifact
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then BIN=target/${{ matrix.target }}/release/disk-cleaner-mcp.exe; else BIN=target/${{ matrix.target }}/release/disk-cleaner-mcp; fi
          (python3 smoke_test.py "$BIN" || python smoke_test.py "$BIN")
      - name: SBOM (cargo-cyclonedx)
        run: |
          cargo install cargo-cyclonedx --locked --quiet
          cargo cyclonedx --locked --format json --override-filename sbom-${{ matrix.target }} --all-features || true
      - name: RPM (Linux only)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-rpm --locked --quiet
          cargo rpm --target ${{ matrix.target }} || true
      - name: Ad-hoc sign macOS binary (Gatekeeper-friendly, no cert needed)
        if: runner.os == 'macOS'
        run: codesign --force --sign - target/${{ matrix.target }}/release/disk-cleaner-mcp && codesign --verify target/${{ matrix.target }}/release/disk-cleaner-mcp
      - name: Rename binary with target suffix
        shell: bash
        run: |
          mv target/${{ matrix.target }}/release/disk-cleaner-mcp${{ matrix.ext }} \
             target/${{ matrix.target }}/release/disk-cleaner-mcp-${{ matrix.target }}${{ matrix.ext }}
      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: disk-cleaner-mcp-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/disk-cleaner-mcp-${{ matrix.target }}${{ matrix.ext }}
            target/cyclonedx/sbom-${{ matrix.target }}.json
            target/${{ matrix.target }}/release/*.rpm

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Include installers (README curl | bash / irm quick start)
        run: cp install.sh install.ps1 artifacts/
      - name: Flatten artifacts (upload preserves target/ tree)
        shell: bash
        run: |
          find artifacts -type f -name "disk-cleaner-mcp-*" -exec cp -f {} artifacts/ \;
          find artifacts -type f -name "sbom-*.json" -exec cp -f {} artifacts/ \;
          find artifacts -type f -name "*.rpm" -exec cp -f {} artifacts/ \;
          find artifacts -type f | sort
      - name: Show artifacts
        run: ls -la artifacts/
      - name: Generate SHA256 checksums
        run: |
          cd artifacts
          sha256sum disk-cleaner-mcp-* install.sh install.ps1 > checksums.txt
          cat checksums.txt
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          generate_release_notes: true
          draft: false
          prerelease: false